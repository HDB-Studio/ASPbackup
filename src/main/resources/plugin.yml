name: ASPbackup
version: ${project.version}
main: com.aspbackup.ASPBackup
api-version: "1.20"
description: 高级备份系统，支持分布式传输，适用于 Minecraft 服务器
author: HDB-Studio
website: https://github.com/HDB-Studio/ASPbackup

softdepend: [Multiverse-Core, Essentials, LuckPerms]

commands:
  aspbackup:
    description: ASPbackup 备份系统主命令
    usage: /<command> <子命令> [参数...]
    aliases: [aspb, backup]
    permission: aspbackup.command
    permission-message: "&c你无权使用此命令。"

permissions:
  aspbackup.command:
    description: 使用 /aspbackup 命令
    default: op
  aspbackup.start:
    description: 手动启动备份
    default: op
  aspbackup.stop:
    description: 停止活动备份
    default: op
  aspbackup.status:
    description: 查看备份状态
    default: op
  aspbackup.resume:
    description: 恢复已中断的备份
    default: op
  aspbackup.list:
    description: 列出备份历史
    default: op
  aspbackup.nodes:
    description: 管理分布式传输节点
    default: op
  aspbackup.verify:
    description: 校验备份完整性
    default: op
  aspbackup.reload:
    description: 重新加载插件配置
    default: op
  aspbackup.*:
    description: ASPbackup 全部功能通配权限
    default: op
    children:
      aspbackup.command: true
      aspbackup.start: true
      aspbackup.stop: true
      aspbackup.status: true
      aspbackup.resume: true
      aspbackup.list: true
      aspbackup.nodes: true
      aspbackup.verify: true
      aspbackup.reload: true