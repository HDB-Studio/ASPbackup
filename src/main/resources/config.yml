# ============================================================
# ASPbackup 配置档案
# ============================================================

# --- 备份设置 ---
backup:
  # 伺服器启动时自动备份
  auto-on-start: true
  # 伺服器关闭时自动备份（/stop 命令）
  auto-on-shutdown: true
  # 启动备份延迟秒数（让伺服器稳定后再执行备份）
  start-delay-seconds: 10
  # 阻塞式备份超时秒数（防止远端传输失败时阻塞伺服器）
  blocking-timeout-seconds: 300
  # 暂存目录（压缩中的备份档）
  temp-directory: "plugins/ASPbackup/temp"
  # 单次备份最大大小（MB），0 = 无限制
  max-backup-size-mb: 0
  # 备份完成后验证完整性
  verify-after-backup: true

  # 压缩设置
  compression:
    # 格式："zip" 或 "targz"
    format: "targz"
    # 压缩等级：1（最快）到 9（最小）
    level: 6

  # 备份来源
  sources:
    # 世界存档
    - path: "world"
      name: "主世界"
      exclude:
        - "**/session.lock"
        - "**/uid.dat"
      max-depth: 100
    - path: "world_nether"
      name: "地狱"
      exclude:
        - "**/session.lock"
    - path: "world_the_end"
      name: "末地"
      exclude:
        - "**/session.lock"
    # 玩家数据
    - path: "world/playerdata"
      name: "玩家背包数据"
      exclude:
        - "**/*.lock"
      max-depth: 10
    - path: "world/stats"
      name: "玩家统计数据"
      exclude:
        - "**/*.lock"
      max-depth: 10
    - path: "world/advancements"
      name: "玩家进度数据"
      exclude:
        - "**/*.lock"
      max-depth: 10
    # 插件文件
    - path: "plugins"
      name: "所有插件文件"
      exclude:
        - "**/ASPbackup/temp/**"
        - "**/dynmap/web/**"
        - "**/*.log"
      max-depth: 50
    # 插件配置文件
    - path: "plugins"
      name: "插件配置文件"
      include:
        - "**/config.yml"
        - "**/config.yaml"
        - "**/settings.yml"
        - "**/*.properties"
        - "**/*.json"
        - "**/*.toml"
        - "**/*.conf"
      exclude:
        - "**/ASPbackup/**"
        - "**/dynmap/web/**"
      max-depth: 30

  # 全局文件过滤规则
  file-filter:
    # 包含的档案（glob 模式）
    include:
      - "**/*"
    # 排除的档案
    exclude:
      - "**/*.tmp"
      - "**/*.lock"
      - "**/*.pid"
    # 最小档案大小（位元组），0 = 不限制
    min-size-bytes: 0
    # 最大档案大小（位元组），0 = 不限制
    max-size-bytes: 0

  # 备份目标
  targets:
    # 本地目标
    - id: "local"
      type: "LOCAL"
      path: "backups/"
      # 保留最近 N 个备份（0 = 保留全部）
      retention-count: 10
      # 最少需要可用空间（MB）
      min-free-space-mb: 1024

    # NAS 目标（挂载的网络磁盘）- 取消注释以启用
    # - id: "nas"
    #   type: "NAS"
    #   path: "/mnt/nas/minecraft-backups/"
    #   retention-count: 5
    #   min-free-space-mb: 5120

    # 远端分散式目标 - 取消注释以启用
    # - id: "remote-cluster"
    #   type: "REMOTE"
    #   retention-count: 3
    #   min-free-space-mb: 10240

# --- 定时备份 ---
schedule:
  enabled: false
  # 自动备份间隔（分钟）
  interval-minutes: 360
  # 备份类型："full" 或 "incremental"
  backup-type: "full"
  # 目标 ID
  target-id: "local"
  # 静默时段（此时间段内不执行备份，24小时制）
  quiet-hours:
    - "02:00-04:00"

# --- 分散式传输设置 ---
transfer:
  # 分块大小（KB）
  chunk-size-kb: 1024
  # 并行传输线程数
  parallel-threads: 4
  # 连线超时（毫秒）
  connect-timeout-ms: 10000
  # 读取超时（毫秒）
  read-timeout-ms: 30000
  # 失败重试次数
  retry-count: 3
  # 重试间隔（毫秒）
  retry-delay-ms: 5000
  # 负载均衡策略："round_robin" 或 "least_loaded"
  load-balance-strategy: "least_loaded"

  # 传输节点（接收端应用）- 取消注释以配置
  # nodes:
  #   - id: "node-1"
  #     host: "192.168.1.101"
  #     port: 9876
  #     auth-token: "your-secure-token-here"
  #     enabled: true
  #     weight: 1
  #   - id: "node-2"
  #     host: "192.168.1.102"
  #     port: 9876
  #     auth-token: "your-secure-token-here"
  #     enabled: true
  #     weight: 1

# --- 断点续传设置 ---
checkpoint:
  # 启用断点续传
  enabled: true
  # 检查点储存目录
  directory: "plugins/ASPbackup/checkpoints"
  # 自动清理超过 N 天的检查点
  max-age-days: 7

# --- 日志设置 ---
logging:
  # 日志级别："DEBUG"、"INFO"、"WARN"、"ERROR"
  level: "INFO"
  # 日志目录
  directory: "plugins/ASPbackup/logs"
  # 保留天数
  retention-days: 30
  # 详细传输日志（记录每个分块的传输状态）
  verbose-transfer: false
  # 同时输出到控制台
  console-output: true

# --- 磁盘空间监控 ---
disk-space:
  # 可用空间低于此百分比时警告
  warn-threshold-percent: 15
  # 检查间隔（秒）
  check-interval-seconds: 300